<section data-markdown>
<textarea data-template>

### UCU

There is a common misconception that UCU is a lecturers union, but in reality:

> anyone who works as an academic, lecturer, trainer, instructor, researcher, administrator, manager, computer staff, librarian or postgraduate in a UK university [...] can join UCU

</textarea>
</section>

<section data-markdown>
<textarea data-template>

### UCU

- QMUCU represents c. 1000 members within QMUL
- Nationally UCU represents c. 120,000 members at c. 150 institutions across the UK


</textarea>
</section>

<section data-markdown>
<textarea data-template>

### What we do

- National pay bargaining
- Sit on JCF
- Represent members in disputes
- Uphold health and safety standards
- Build a better place to work

</textarea>
</section>

<section data-markdown>
<textarea data-template>

### How it all works

Unions are democratic: as a member you can attend meetings, and propose and vote on policy.

Each university has a branch with local priorites and campaigns, and branches come together to vote on national policies.

![](img/campaigns.png) <!-- .element width="80%" class="plain"-->


</textarea>
</section>


<section data-markdown>
<textarea data-template>

### What we have achieved

- Secured £1000s in back pay with unison, after spotting an error in staff holiday pay
- Helped members on fixed term contracts secure permenancy
- Run workshops on reducing work related stress
- Trained staff on employment rights
- Represented countless members in disputes
- Fought employment tribunals to defend fundamental employment rights
- Protected USS pensions

</textarea>
</section>

<section data-markdown>
<textarea data-template>

### Benefits of joining a union

- Protection and advice if something goes wrong
- We have each other's back
- Community
- Your voice is heard
- Better understanding of the reality of working at QM

</textarea>
</section>
